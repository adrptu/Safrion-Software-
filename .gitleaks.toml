title = "Safrion — regras padrão e canário de privacidade identificado"

[extend]
useDefault = true

# HML-SECRET-01: literal sintético dos testes de falha de conexão (porta 1).
# A exceção também cobre sua introdução no histórico, antes desta configuração.
# Não libera outros valores nos testes, nem este valor fora desses dois arquivos.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Canário exato de privacidade de preparo e vínculo; não é credencial de ambiente"
condition = "AND"
regexTarget = "secret"
paths = ['''^packages/db/test/preparo\.int\.test\.ts$''', '''^packages/db/test/vinculo\.int\.test\.ts$''']
regexes = ['''^SenhaQueNaoPodeVazar123$''']

# HML-SECRET-02: nomes de Secret Manager usados por value_source.secret_key_ref.
# Este identificador não é senha; outros valores/arquivos continuam sujeitos à regra.
[[rules]]
id = "hashicorp-tf-password"
[[rules.allowlists]]
description = "Identificador exato do Secret Manager no mapa de referências da HML"
condition = "AND"
regexTarget = "secret"
paths = ['''^infra/terraform/hml/cloud_run\.tf$''']
regexes = ['''^"hml-db-admin-senha"$''']
