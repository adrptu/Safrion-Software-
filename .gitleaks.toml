title = "Safrion — regras padrão e canário de privacidade identificado"

[extend]
useDefault = true

# HML-SECRET-01: literal sintético do teste de falha de conexão (porta 1).
# A exceção também cobre sua introdução no histórico, antes desta configuração.
# Não libera outros valores no teste, nem este valor fora desse arquivo.
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Canário exato de privacidade do preparo; não é credencial de ambiente"
condition = "AND"
regexTarget = "secret"
paths = ['''^packages/db/test/preparo\.int\.test\.ts$''']
regexes = ['''^SenhaQueNaoPodeVazar123$''']
