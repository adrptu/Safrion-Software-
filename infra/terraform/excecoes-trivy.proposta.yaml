    statement: 'Não aplicável: ssl_mode ENCRYPTED_ONLY recusa conexão sem TLS; o Trivy 0.74 com checks embutidos acusa GCP-0015 com ENCRYPTED_ONLY, e nas fixtures só o require_ssl legado silenciou o achado (aquasecurity/trivy#9999; contraprova do Codex em candidate-41dd295/evidence/tls-counterexamples). A exceção vale por regra e arquivo e cobre também TLS inseguro ou segunda instância no arquivo: só vale junto do checar_travas.py obrigatório na CI (infra.yml), que recusa ssl_mode diferente de ENCRYPTED_ONLY e segunda instância. Prazo de 30 dias para reavaliar na próxima atualização do Trivy e o estado da aquasecurity/trivy#9999.'
