[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    --strict-markers
    --strict-config
    -p no:cacheprovider
    --cov=app
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=80
    --junitxml=reports/junit.xml
markers =
    unit: testes rápidos sem I/O
    integration: usam banco/fila reais via Testcontainers
    e2e: fluxos completos
asyncio_mode = auto
filterwarnings =
    error
    ignore::DeprecationWarning:thirdparty.*
