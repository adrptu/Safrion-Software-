<meta charset="utf-8">
<title>Pragas e doenças no tempo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mapa da fazenda com a linha do tempo de manejo e clima embaixo; painel do talhão à direita (embaixo no celular). */
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --surface-2: #F2F5F1; --line: #E1E7E2;
  --ink: #15201A; --ink-2: #3E4A43; --muted: #65736A;
  --accent: #1E7A4C; --accent-weak: #E4F3E9;
  --ok: #2E7A4F; --warn: #946210; --bad: #A3261B; --nodata: #66716B; --nocrop: #8A7C5C; --water: #3F6E8C;
  --field-a: #7C8C55; --field-b: #6E7E4A; --field-line: rgba(255,255,255,.18);
  --chart-line: #1E7A4C; --chart-fill: rgba(30,122,76,.12); --band: rgba(30,122,76,.10); --global: #65736A; --nc: #A3261B;
  --def: #1F5F8B; --adub: #7B4FA0; --oper: #5B6660; --rain: #8DB9D8; --irr: #2A9BAE; --fav: #A3261B;
  --c1: #E4002B; --c2: #FF6A00; --c3: #FFD500; --c4: #B5E61D; --c5: #3FBF2A; --c6: #0B7A1E;
  --t1: #FCEBCF; --t2: #F8C98B; --t3: #F09E50; --t4: #DA6A2C; --t5: #B33A15;
  --u1: #E7F1F8; --u2: #BDD9EC; --u3: #8DBBDC; --u4: #5A95C3; --u5: #2D6C9C;
  --shadow: 0 12px 28px -14px rgba(21,32,26,.35);
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1611; --surface: #161F19; --surface-2: #1B261F; --line: #29362E; --ink: #E5ECE6; --ink-2: #C3CEC6; --muted: #93A398;
    --accent: #4FB383; --accent-weak: #1D3527; --ok: #2F7D52; --warn: #946210; --bad: #B03328; --nodata: #5C6862; --nocrop: #7A6D50; --water: #355E78;
    --field-a: #4A5734; --field-b: #414D2E; --field-line: rgba(255,255,255,.10);
    --chart-line: #4FB383; --chart-fill: rgba(79,179,131,.16); --band: rgba(79,179,131,.14); --global: #93A398; --nc: #E07A6E;
    --def: #6FA8D6; --adub: #B48AD8; --oper: #9AA8A0; --rain: #4E7FA3; --irr: #48B9CB; --fav: #E07A6E;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1611; --surface: #161F19; --surface-2: #1B261F; --line: #29362E; --ink: #E5ECE6; --ink-2: #C3CEC6; --muted: #93A398;
  --accent: #4FB383; --accent-weak: #1D3527; --ok: #2F7D52; --warn: #946210; --bad: #B03328; --nodata: #5C6862; --nocrop: #7A6D50; --water: #355E78;
  --field-a: #4A5734; --field-b: #414D2E; --field-line: rgba(255,255,255,.10);
  --chart-line: #4FB383; --chart-fill: rgba(79,179,131,.16); --band: rgba(79,179,131,.14); --global: #93A398; --nc: #E07A6E;
  --def: #6FA8D6; --adub: #B48AD8; --oper: #9AA8A0; --rain: #4E7FA3; --irr: #48B9CB; --fav: #E07A6E;
  --shadow: 0 12px 28px -14px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 24px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.crumb { font-size: 12px; color: var(--muted); font-weight: 600; }
h1 { font-size: 22px; line-height: 1.2; margin: 2px 0 0; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px; }
.ctx span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.ctx b { color: var(--muted); font-weight: 600; margin-right: 4px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); gap: 12px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.mapcard { overflow: visible; }
.mapcard .bar { border-radius: 14px 14px 0 0; }

.bar { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 32px; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.seg.big button { font-size: 13.5px; padding: 7px 14px; }
.measure { font-size: 12.5px; color: var(--muted); }
.measure b { color: var(--ink-2); }

.map { position: relative; container-type: inline-size; aspect-ratio: 16 / 7.4; width: 100%;
  background:
    linear-gradient(90deg, var(--field-line) 1px, transparent 1px) 0 0 / 16.66% 100%,
    linear-gradient(0deg, var(--field-line) 1px, transparent 1px) 0 0 / 100% 25%,
    radial-gradient(circle at 20% 30%, var(--field-a) 0 2px, transparent 3px) 0 0 / 14px 14px,
    radial-gradient(circle at 70% 60%, var(--field-b) 0 2px, transparent 3px) 0 0 / 11px 11px,
    var(--field-a); }
.lake { position: absolute; border-radius: 50%; background: var(--water); opacity: .9; }
.pv { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.85);
  display: grid; place-content: center; text-align: center; color: #fff; cursor: pointer; padding: 0; line-height: 1.12;
  text-shadow: 0 1px 2px rgba(0,0,0,.55); transition: background-color .25s ease, box-shadow .2s ease; }
.pv.dark { color: #15201A; text-shadow: 0 0 3px rgba(255,255,255,.9); }
.pv .id { font-weight: 800; font-size: clamp(9px, 1.55cqw, 15px); }
.pv .v { font-weight: 700; font-size: clamp(8px, 1.2cqw, 12.5px); }
.pv .s { font-weight: 600; font-size: clamp(7px, .95cqw, 11px); opacity: .95; }
.pv.ok { background: var(--ok); } .pv.warn { background: var(--warn); } .pv.bad { background: var(--bad); }
.pv.nodata { background: repeating-linear-gradient(135deg, var(--nodata) 0 6px, color-mix(in srgb, var(--nodata) 80%, #fff) 6px 9px); }
.pv.cloud { background: repeating-linear-gradient(135deg, #9E9E9E 0 6px, #C9C9C9 6px 9px); color: #15201A; text-shadow: 0 0 3px rgba(255,255,255,.9); }
.pv.nocrop { background: var(--nocrop); cursor: default; }
.pv[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px rgba(255,255,255,.7); z-index: 2; }
@media (hover: hover) { .pv:not(.nocrop):hover { box-shadow: 0 0 0 3px rgba(255,255,255,.9); } }
.badges { position: absolute; top: -5px; right: -6px; display: flex; gap: 2px; }
.badge { width: clamp(15px, 2.2cqw, 20px); height: clamp(15px, 2.2cqw, 20px); border-radius: 50%; background: var(--surface); display: grid; place-items: center; border: 2px solid; }
.badge svg { width: 62%; height: 62%; fill: currentColor; }
.maptip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 250px; text-shadow: none; }
.maptip b { display: block; }
.demo { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.4); padding: 2px 8px; border-radius: 999px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.legend i.hatch { background: repeating-linear-gradient(135deg, #9E9E9E 0 3px, #C9C9C9 3px 5px); }

.time { padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.timehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 6px; }
.now { font-size: 13px; color: var(--ink-2); }
.now strong { font-size: 15px; color: var(--ink); }
.ctrls { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); color: #fff; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 2px 0 6px; font-size: 12px; color: var(--muted); }
.tg { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 5px; font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--ink-2); min-height: 30px; }
.tg[aria-pressed="false"] { opacity: .5; }
.tg .ic { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; border: 2px solid; }
.tg .ic svg { width: 11px; height: 11px; fill: currentColor; }

.chartbox { position: relative; }
.chartwrap { position: relative; touch-action: none; user-select: none; cursor: ew-resize; border-radius: 10px; }
.chartwrap:focus-visible { outline-offset: 4px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.ax { stroke: var(--line); stroke-width: 1; }
.grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.ncl { stroke: var(--nc); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.gl { stroke: var(--global); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.ml { stroke: var(--chart-line); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.mf { fill: var(--chart-fill); stroke: none; }
.bandf { fill: var(--band); stroke: none; }
.rainb { fill: var(--rain); } .irrb { fill: var(--irr); } .favb { fill: var(--fav); }
.evline { stroke-width: 1; stroke-dasharray: 2 3; opacity: .5; }
.cursor { stroke: var(--ink); stroke-width: 1.5; }
.knob { fill: var(--ink); }
.knobtxt { fill: var(--surface); font-weight: 800; font-size: 11px; }
.hoverline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.pt { fill: var(--surface); stroke: var(--chart-line); stroke-width: 2; }
.pt.bad { stroke: var(--nc); }
.pt.cloud { fill: var(--surface); stroke: #9E9E9E; stroke-dasharray: 2 2; }
.scn { stroke: var(--muted); stroke-width: 1; }
.evt { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid; background: var(--surface); display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 3; }
.evt svg { width: 12px; height: 12px; fill: currentColor; }
.evt .n { position: absolute; top: -8px; right: -9px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 9.5px; font-weight: 800; display: grid; place-items: center; padding: 0 3px; }
.evt[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
.evt.def { border-color: var(--def); color: var(--def); } .evt.adub { border-color: var(--adub); color: var(--adub); }
.lanelab { position: absolute; left: 0; font-size: 10.5px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
.tip { position: absolute; z-index: 6; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); min-width: 180px; max-width: 270px; }
.tip b { display: block; margin-bottom: 2px; }
.tip .row, .pop .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.pop { position: absolute; z-index: 8; width: min(340px, calc(100% - 8px)); max-height: 420px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px 12px; font-size: 12.5px; display: grid; gap: 8px; cursor: default; }
.pop h4 { margin: 0; font-size: 13.5px; font-weight: 800; padding-right: 26px; }
.pop .x { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); }
.pop .x:hover { background: var(--surface-2); }
.pop .ev { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.pop h4 + .ev { border-top: 0; padding-top: 0; }
.pop .k { color: var(--muted); }
.pop .k.warn { color: var(--warn); font-weight: 600; }
.pop table { width: 100%; border-collapse: collapse; }
.pop td { padding: 2px 0; vertical-align: top; }
.pop td.r { text-align: right; white-space: nowrap; padding-left: 8px; }
.pop .eff { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; color: var(--ink-2); }
.pop .eff b { color: var(--ink); }
.pop .go { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 2px 0; cursor: pointer; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.d { border-top-style: dashed; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.ramp { display: inline-flex; } .ramp i { width: 8px; height: 10px; display: inline-block; }

.panel { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
.panel .ph { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.panel h3 { margin: 0; font-size: 16px; font-weight: 800; }
.panel .sub { font-size: 12.5px; color: var(--muted); }
.panel .pb { padding: 12px 14px 14px; display: grid; gap: 12px; }
.back { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 0; cursor: pointer; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.insights { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.insights li { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: 13px; color: var(--ink-2); }
.insights li strong { color: var(--ink); }
.note { font-size: 12px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tblwrap { overflow-x: auto; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th button { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
.tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; }
.apps { display: grid; gap: 8px; }
.app { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.app:hover { border-color: var(--accent); }
.app .d { font-weight: 800; font-size: 13px; }
.app .p { font-weight: 700; font-size: 13px; }
.app .m { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.app .e { font-weight: 800; font-size: 13px; text-align: right; }
.app .e.good { color: var(--ok); } .app .e.weak { color: var(--warn); }
.app .ctl { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); }
.decide { display: grid; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 10px 11px; }
.empty { color: var(--muted); font-size: 13px; }
h5 { margin: 0; font-size: 13px; font-weight: 800; }

/* Raio-X do alvo */
.sec { display: grid; gap: 8px; }
.sec h5 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.up { color: var(--bad); } .dn { color: var(--ok); }
.fx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.fx:hover { border-color: var(--accent); }
.fx .t { font-weight: 700; font-size: 13px; }
.fx .e { font-weight: 800; font-size: 14px; text-align: right; white-space: nowrap; }
.fx .c, .fx .m, .fx svg { grid-column: 1 / 3; }
.fx .c { font-size: 12px; color: var(--ink-2); }
.fx .m { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
.tag { font-size: 10.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 6px; }
svg.effbar { width: 100%; height: 12px; display: block; }
svg.effbar .z { stroke: var(--muted); stroke-width: 1; }
svg.effbar .ci { stroke: var(--muted); stroke-width: 2; opacity: .55; }
svg.effbar .b.up { fill: var(--bad); } svg.effbar .b.dn { fill: var(--ok); }
.lvl { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--ink-2); font-size: 12px; }
.lvl .dots { display: inline-flex; gap: 2px; } .lvl .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; display: inline-block; } .lvl .dots i.on { background: currentColor; }
.lvl.confirmar { color: var(--warn); }
.lead { margin: 0; font-size: 13.5px; color: var(--ink-2); } .lead strong { font-size: 15px; }
svg.curve { width: 100%; height: auto; display: block; }
svg.curve .cpt { fill: var(--surface); stroke: var(--muted); stroke-width: 2; } svg.curve .cpt.up { fill: var(--bad); stroke: var(--bad); } svg.curve .cpt.dn { fill: var(--ok); stroke: var(--ok); }
.wins { display: grid; gap: 4px; font-size: 12px; color: var(--ink-2); }
.wrow { display: grid; grid-template-columns: 150px 1fr 44px; gap: 8px; align-items: center; } .wrow.on { font-weight: 700; color: var(--ink); }
.wbar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; } .wbar i { display: block; height: 100%; border-radius: 4px; } .wbar i.up { background: var(--bad); } .wbar i.dn { background: var(--ok); }
.rk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.rkmain { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font: inherit; color: inherit; }
.rkmain .d { font-weight: 800; } .rkmain .m { grid-column: 1 / 3; font-size: 12px; color: var(--muted); }
.rkmain:hover .d { color: var(--accent); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12px; }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.lnk { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 2px 0; cursor: pointer; font-size: inherit; }
.rkline { font-size: 12.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.heat { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; }
.heat th { font-size: 10.5px; color: var(--muted); font-weight: 700; text-align: center; vertical-align: bottom; }
.heat th.l, .heat td.l { text-align: left; } .heat td.l { font-weight: 600; color: var(--ink-2); }

<script>
(() => {
'use strict';
// ================= base sintética · Lagoa Grande · mamão =================
const START = new Date(2026, 6, 1);   // 01/07/2026
const DAYS = 86;                      // 25/09/2026, data da última cena de satélite
const RAINMM = { 18: 22, 19: 9, 37: 14, 38: 31, 39: 6, 52: 18, 66: 11, 67: 25, 79: 16 };
const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dDate = d => { const x = new Date(START); x.setDate(x.getDate() + d); return x; };
const fmtD = d => { const x = dDate(d); return String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); };
const median = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const signed2 = v => (Math.abs(v) < .005 ? '' : v > 0 ? '+' : '−') + nf2.format(Math.abs(v));
const pct = v => (v >= 0 ? '+' : '−') + nf0.format(Math.abs(v * 100)) + ' %';
const dose = (v) => nf2.format(v).replace(/,00$/, '');
function rngFor(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } let a = h >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---- clima diário da estação da fazenda (sintético) e previsão dos 7 dias seguintes ----
const PREV_RAIN = { 90: 14 };   // previsão sintética: chuva em 30/09
function climaDia(d, r, rv, rainMap) {
  const t = d / DAYS, rain = rainMap[d] || 0, rainPrev = rainMap[d - 1] || 0;
  const wave = d >= 44 && d <= 50 ? 3.6 : d >= 74 && d <= 80 ? 3.1 : 0;
  const tmax = 29.2 + 4.4 * t + wave + (r() - .5) * 1.8 - (rain ? 3.5 : 0) - (rainPrev ? 1.2 : 0);
  const tmin = tmax - 11.5 + (r() - .5) * 2 + (rain ? 2.5 : 0);
  const ur = Math.max(24, Math.min(96, 60 - 16 * t - wave * 2.6 + (rain ? 26 : 0) + (rainPrev ? 12 : 0) + (r() - .5) * 8));
  const molh = rain ? 9 + r() * 5 : rainPrev ? 5 + r() * 4 : ur > 62 ? 2 + r() * 3 : r() * 1.5;
  const tmed = (tmax + tmin) / 2, es = 0.6108 * Math.exp(17.27 * tmed / (tmed + 237.3));
  return { tmax, tmin, ur, molh, dpv: es * (1 - ur / 100), chuva: rain, vento: 1.2 + rv() * 2.8, quenteSeco: tmax >= 32 && ur < 50, calor: tmax >= 35, molhado: molh >= 8 && tmed >= 18 && tmed <= 30 };
}
const CLIMA = [], CLIMA_PREV = [];
(() => { const r = rngFor('clima'), rv = rngFor('vento'); for (let d = 0; d <= DAYS; d++) CLIMA.push(climaDia(d, r, rv, RAINMM)); })();
(() => { const r = rngFor('previsao'), rv = rngFor('vento-prev'), m = Object.assign({}, RAINMM, PREV_RAIN); for (let d = DAYS + 1; d <= DAYS + 7; d++) CLIMA_PREV.push(Object.assign(climaDia(d, r, rv, m), { prev: true })); })();
const climaAt = d => d <= DAYS ? CLIMA[d] : CLIMA_PREV[d - DAYS - 1];

// ---- pivôs: áreas e NDVI das cenas de 10/09 e 25/09 do protótipo oficial (lagoa_s2.json, sintético) ----
const PIVO_DATA = [
  ['P1', 29.92, .58, .56], ['P2', 37.75, .78, .80], ['P3', 70.18, .55, .55], ['P4', 73.18, .77, .78], ['P5', 71.11, .26, .39], ['P6', 62.79, .78, .78],
  ['P7', 61.39, .38, .38], ['P8', 50.63, .39, .39], ['P9', 74.98, .80, .78], ['P10', 30.15, .58, .55], ['P11', 50.0, .15, .17], ['P12', 48.47, .64, .14],
  ['P13', 49.31, .15, .16], ['P14', 63.16, .55, .58], ['P15', 36.17, .38, .36], null, ['P17', 33.36, .80, .78], ['P18', 48.93, .80, .80],
  ['P19', 75.11, .79, .78], ['P20', 77.39, .78, .79], ['P21', 80.82, .55, .58], ['P22', 62.07, .77, .77], ['P23', 63.99, .78, .78], ['P24', 34.37, .78, .80]];
const STAGE = { P1: 'media', P3: 'media', P10: 'media', P14: 'media', P21: 'media', P5: 'jovem', P7: 'jovem', P8: 'jovem', P15: 'jovem', P11: 'solo', P13: 'solo', P12: 'velha' };
const STAGE_TXT = { adulta: 'em produção', media: 'em formação', jovem: 'plantio novo', solo: 'sem lavoura', velha: 'lavoura velha erradicada' };
const PIVOS = PIVO_DATA.map((p, i) => { if (!p) return null; const col = i % 6, row = Math.floor(i / 6);
  return { id: p[0], ha: p[1], a71: p[2], a86: p[3], stage: STAGE[p[0]] || 'adulta', x: 8.5 + col * 16.6, y: 12.8 + row * 24.8 }; }).filter(Boolean);
PIVOS.forEach(p => { p.pestOff = ['solo', 'velha'].includes(p.stage); });
const P = id => PIVOS.find(p => p.id === id);

// ---- pragas e doenças (resposta ligada ao clima) ----
const ALVOS = [
  { id: 'acaro', nome: 'Ácaro-rajado', art: 'o ácaro-rajado', fx: { def: .05, n: .004, k: 0, lav: .6 }, med: 'folhas com ácaro', un: '%', curto: '%', nc: 15, cap: 70, x0: [.5, 2.2], wk: [1.45, 1.45], imm: .05,
    clima: c => 1 + (c.quenteSeco ? .05 : 0) - (c.molhado ? .025 : 0), fav: c => c.quenteSeco, favTxt: 'dia quente e seco (≥ 32 °C e UR < 50 %)', favCurto: 'quente e seco',
    prods: [ { n: 'Espirodiclofeno 240 SC', c: 'Espirodiclofeno', g: 'IRAC 23', base: .86, res: 18, dose: .3, du: 'L' },
             { n: 'Abamectina 18 EC', c: 'Abamectina', g: 'IRAC 6', base: .80, res: 10, dose: .5, du: 'L' },
             { n: 'Fenpiroximato 50 SC', c: 'Fenpiroximato', g: 'IRAC 21A', base: .80, res: 13, dose: 1, du: 'L' },
             { n: 'Óleo mineral', c: 'Óleo mineral', g: 'ação física', base: .38, res: 3, dose: 1.5, du: 'L' } ] },
  { id: 'mosca', nome: 'Mosca-branca', art: 'a mosca-branca', fx: { def: 0, n: .006, k: 0, lav: .7 }, med: 'adultos por folha', un: '', curto: '/folha', nc: 5, cap: 40, x0: [.3, 1.2], wk: [1.36, 1.36], imm: .025,
    clima: c => 1 + (c.quenteSeco ? .04 : 0) - (c.molhado ? .02 : 0), fav: c => c.quenteSeco, favTxt: 'dia quente e seco (≥ 32 °C e UR < 50 %)', favCurto: 'quente e seco',
    prods: [ { n: 'Espiromesifeno 240 SC', c: 'Espiromesifeno', g: 'IRAC 23', base: .80, res: 16, dose: .5, du: 'L' },
             { n: 'Acetamiprido 200 SP', c: 'Acetamiprido', g: 'IRAC 4A', base: .74, res: 10, dose: .25, du: 'kg' },
             { n: 'Piriproxifem 100 EC', c: 'Piriproxifem', g: 'IRAC 7C', base: .62, res: 20, dose: .5, du: 'L' } ] },
  { id: 'antrac', nome: 'Antracnose', art: 'a antracnose', fx: { def: 0, n: 0, k: .03, lav: 1 }, med: 'frutos com lesão', un: '%', curto: '%', nc: 5, cap: 45, x0: [.3, 1.1], wk: [1.0, 1.0], imm: .01,
    clima: c => c.molhado ? 1.085 : (c.ur > 65 ? 1.012 : .993), fav: c => c.molhado, favTxt: 'dia com 8 h ou mais de folha molhada (UR ≥ 90 %) entre 18 e 30 °C', favCurto: 'molhamento ≥ 8 h',
    prods: [ { n: 'Azoxistrobina 250 SC', c: 'Azoxistrobina', g: 'FRAC 11', base: .70, res: 14, dose: .4, du: 'L' },
             { n: 'Tebuconazol 200 EC', c: 'Tebuconazol', g: 'FRAC 3', base: .66, res: 12, dose: 1, du: 'L' },
             { n: 'Mancozebe 800 WP', c: 'Mancozebe', g: 'FRAC M3', base: .45, res: 7, dose: 3, du: 'kg' } ] },
  { id: 'cochon', nome: 'Cochonilha', art: 'a cochonilha', fx: { def: 0, n: .004, k: 0, lav: 1 }, med: 'plantas com colônia', un: '%', curto: '%', nc: 10, cap: 50, x0: [.8, 2.5], wk: [1.12, 1.12], imm: .03,
    clima: c => 1 + (c.quenteSeco ? .03 : 0), fav: c => c.quenteSeco, favTxt: 'dia quente e seco (≥ 32 °C e UR < 50 %)', favCurto: 'quente e seco',
    prods: [ { n: 'Buprofezina 250 SC', c: 'Buprofezina', g: 'IRAC 16', base: .74, res: 20, dose: 1, du: 'L' },
             { n: 'Acetamiprido 200 SP', c: 'Acetamiprido', g: 'IRAC 4A', base: .70, res: 12, dose: .25, du: 'kg' },
             { n: 'Óleo mineral', c: 'Óleo mineral', g: 'ação física', base: .45, res: 4, dose: 1.5, du: 'L' } ] } ];
// efeitos plantados na eficácia (gabarito da demonstração): dia quente e seco e chuva até 1 dia depois reduzem a eficácia
const APP_FX = { qs: .78, chuva: .7 };
const avOf = (pid, d) => (rngFor('av' + pid + '|' + d)() < .5 ? 'A' : 'B');   // avaliador da vistoria (sem efeito: variável de ruído)
const EQ = { a600: { n: 'Atomizador · 600 L/ha', c: 'Atomizador 600 L/ha', cov: 1.0, lha: 600 }, a400: { n: 'Atomizador · 400 L/ha', c: 'Atomizador 400 L/ha', cov: .9, lha: 400 }, b100: { n: 'Barra · 100 L/ha', c: 'Barra 100 L/ha', cov: .6, lha: 100 } };
const PROF = {};
PIVOS.forEach(p => { const r = rngFor('prof' + p.id); const late = ['P4', 'P9', 'P21', 'P20'].includes(p.id);
  PROF[p.id] = { press: 0.75 + r() * 0.7, eq: ['P4', 'P6', 'P20'].includes(p.id) ? 'b100' : (['P3', 'P9', 'P14', 'P22'].includes(p.id) ? 'a400' : 'a600'),
    repete: ['P6', 'P17', 'P21'].includes(p.id), oleo1: ['P2', 'P9', 'P24'].includes(p.id), delay: late ? 6 + Math.floor(r() * 2) : 2 + Math.floor(r() * 3),
    gatilho: late ? 1.15 : 0.9, off: Math.floor(r() * 3), falha: p.id === 'P17' ? [71, 78] : [] }; });
const HOT = { acaro: ['P4', 'P6', 'P17', 'P9', 'P21'], mosca: ['P1', 'P2', 'P8'], antrac: ['P19', 'P23', 'P5'], cochon: ['P18', 'P14'] };

function simulatePest(p, a) {
  const r = rngFor(p.id + a.id), pf = PROF[p.id], hot = HOT[a.id].includes(p.id) ? 1.55 : 1;
  const fx = a.fx, falta = Math.max(0, .95 - WATER[p.id].suff) / .27, NK = NUT[p.id];   // efeitos plantados: falta de água, N e K recentes, chuva forte
  let x = (a.x0[0] + r() * (a.x0[1] - a.x0[0])) * pf.press * hot * (p.stage === 'jovem' ? .7 : 1);
  const obs = [], apps = []; let resid = 0, last = -99, pending = null, lastGroup = null, n = 0, consec = 0; const groupCount = {};
  for (let d = 0; d <= DAYS; d++) {
    if (pending && pending.day === d) {
      let prod;
      if (pf.oleo1 && n === 0 && a.prods.some(q => q.c === 'Óleo mineral')) prod = a.prods.find(q => q.c === 'Óleo mineral');
      else if (pf.repete) prod = a.prods.find(q => q.c !== 'Óleo mineral') || a.prods[0];
      else { const cand = a.prods.filter(q => q.c !== 'Óleo mineral' && q.g !== lastGroup); prod = cand[(n + p.id.length) % cand.length] || a.prods[0]; }
      const rep = groupCount[prod.g] || 0; consec = prod.g === lastGroup ? consec + 1 : 0;
      const eq = EQ[pf.eq], resist = consec > 0 ? Math.pow(.7, consec) : Math.pow(.93, rep);
      const qsDia = CLIMA[d].quenteSeco, chuvaDepois = (RAINMM[d] || 0) + (RAINMM[d + 1] || 0) >= 5;
      const eff = Math.min(.95, prod.base * eq.cov * resist * (qsDia ? APP_FX.qs : 1) * (chuvaDepois ? APP_FX.chuva : 1) * (0.9 + r() * 0.18));
      x = x * (1 - eff); resid = Math.round(prod.res * (0.7 + 0.3 * eq.cov));
      groupCount[prod.g] = rep + 1; lastGroup = prod.g; n++; last = d;
      apps.push({ day: d, prod, eq: pf.eq, entrada: n, rep: rep + 1, consec, alvo: a.id, qsDia, chuvaDepois }); pending = null;
    }
    const wk = a.wk[0] + (a.wk[1] - a.wk[0]) * d / DAYS;
    let g = Math.pow(wk, 1 / 7) * a.clima(CLIMA[d]) * (1 + fx.def * falta + fx.n * (NK.n14[d] - 6.4) + fx.k * Math.max(0, 1 - NK.k14[d] / 20)); if (resid > 0) { g = 1 + (g - 1) * 0.2; resid--; }
    x = Math.max(.05, Math.min(a.cap, x * g + a.imm * pf.press * hot * (resid > 0 ? 0.3 : 1)));
    if ((RAINMM[d] || 0) >= 10) x = Math.max(.05, x * fx.lav);
    if ((d - 1 - pf.off) % 7 === 0 && d >= 1 + pf.off && !pf.falha.includes(d)) {
      const v = Math.max(0, x * (0.88 + r() * 0.24)); obs.push({ day: d, v, aval: avOf(p.id, d) });
      if (v >= a.nc * pf.gatilho && d - last > 9 && !pending) pending = { day: Math.min(DAYS, d + pf.delay) };
    }
  }
  apps.forEach(ap => { const before = [...obs].reverse().find(o => o.day <= ap.day && ap.day - o.day <= 10); const after = obs.find(o => o.day >= ap.day + 5 && o.day <= ap.day + 14);
    ap.before = before || null; ap.after = after || null; ap.red = before && after && before.v > 0 ? (before.v - after.v) / before.v : null;
    const back = obs.find(o => o.day > ap.day && o.v >= a.nc); ap.backDay = back ? back.day : null; });
  return { obs, apps };
}

// ---- água e adubação ----
const NEED = { adulta: 5.2, media: 4.6, jovem: 3.0, solo: 0, velha: 4.0 };        // mm/dia (ETc de exemplo, ajustada pelo DPV)
const SUFF = { P3: .68, P14: .7, P21: .7, P20: .9 };                              // fração da necessidade atendida pela irrigação
const FERT = {
  std: { every: 14, items: [['Nitrato de amônio', 20, { N: .32 }], ['Sulfato de potássio', 45, { K2O: .5, S: .17 }]], via: 'Fertirrigação', nome: 'Nitrato de amônio + sulfato de potássio · a cada 14 dias' },
  ureia: { every: 14, items: [['Ureia', 12, { N: .45 }], ['Cloreto de potássio', 30, { K2O: .6 }]], via: 'Fertirrigação', nome: 'Ureia + cloreto de potássio' },
  irreg: { every: 31, items: [['Nitrato de amônio', 20, { N: .32 }], ['Sulfato de potássio', 45, { K2O: .5, S: .17 }]], via: 'Fertirrigação', nome: 'Nitrato de amônio + sulfato de potássio · intervalo > 21 dias' },
  arranque: { every: 10, items: [['Nitrato de amônio', 25, { N: .32 }], ['Ácido bórico', 1, { B: .17 }]], via: 'Fertirrigação de arranque', nome: 'Arranque: nitrato de amônio + ácido bórico' } };
const PLAN = { P9: 'ureia', P23: 'ureia', P20: 'irreg', P24: 'irreg', P1: 'irreg', P10: 'irreg' };
const EVENTS = [], WATER = {}, SAT = {}; let evSeq = 0;
const addEvent = e => { e.id = 'e' + (++evSeq); EVENTS.push(e); return e; };
const needOn = (p, d) => NEED[p.stage] * Math.max(.75, Math.min(1.35, 1 + .14 * (CLIMA[d].dpv - 1.9)));
PIVOS.forEach(p => {
  const r = rngFor('w' + p.id); const suff = SUFF[p.id] || (p.stage === 'jovem' ? 1 : .98);
  const irr = new Array(DAYS + 1).fill(0); const off = Math.floor(r() * 3);
  if (NEED[p.stage] > 0) for (let d = off; d <= DAYS; d += 3) {
    if ((RAINMM[d] || 0) + (RAINMM[d - 1] || 0) >= 10) continue;
    const rain3 = [0, 1, 2].reduce((s, k) => s + (RAINMM[d - k] || 0), 0); const need3 = [0, 1, 2].reduce((s, k) => s + needOn(p, Math.min(DAYS, d + k)), 0);
    irr[d] = Math.max(0, Math.round((need3 - rain3) * suff * 2) / 2);
  }
  WATER[p.id] = { irr, suff };
  if (['adulta', 'media', 'jovem'].includes(p.stage)) {
    const prog = p.stage === 'jovem' ? 'arranque' : (PLAN[p.id] || 'std'); const pr = FERT[prog]; let d = 3 + Math.floor(r() * 6);
    while (d <= DAYS) {
      const items = pr.items.map(([n, ds, nut]) => ({ n, dose: ds, du: 'kg', total: ds * p.ha, nut: Object.fromEntries(Object.entries(nut).map(([k, f]) => [k, ds * f])) }));
      addEvent({ kind: 'adub', day: d, pid: p.id, via: pr.via, prog, progNome: pr.nome, items });
      d += pr.every + (prog === 'irreg' ? Math.floor(r() * 6) : Math.floor(r() * 2));
    }
  }
});
// N e K2O aplicados nos 14 dias até cada data (kg/ha), por pivô
const NUT = {}; PIVOS.forEach(p => { const n = new Array(DAYS + 8).fill(0), k = new Array(DAYS + 8).fill(0);
  EVENTS.forEach(e => { if (e.kind !== 'adub' || e.pid !== p.id) return; const N = e.items.reduce((s, it) => s + (it.nut.N || 0), 0), K = e.items.reduce((s, it) => s + (it.nut.K2O || 0), 0);
    for (let d = e.day; d < e.day + 14 && d < n.length; d++) { n[d] += N; k[d] += K; } });
  NUT[p.id] = { n14: n, k14: k }; });
const PEST = {}; ALVOS.forEach(a => { PEST[a.id] = {}; PIVOS.forEach(p => { if (!p.pestOff) PEST[a.id][p.id] = simulatePest(p, a); }); });

  const keyFn = { prod: h => h.ap.prod.c, calda: h => h.ap.prod.c + ' · ' + EQ[h.ap.eq].c, entrada: h => h.ap.prod.c + ' · ' + (h.ap.consec >= 2 ? '3ª seguida ou mais' : h.ap.consec === 1 ? '2ª seguida' : 'em rotação'),
    clima: h => h.ap.chuvaDepois ? 'Chuva até 1 dia depois' : h.ap.qsDia ? 'Dia quente e seco' : 'Condição normal' }[S.group];
  const subFn = S.group === 'clima' ? () => 'todas as aplicações do alvo' : h => h.ap.prod.g + ' · ' + dose(h.ap.prod.dose) + ' ' + h.ap.prod.du + '/ha';
  const rows = htGroups(H, keyFn, subFn, S.group + R.D).map(g => ({ k: g.k, sub: g.sub, n: g.n, nValid: g.nValid, red: g.E, km: g.km, ctl: g.km ? (g.km.med != null ? g.km.med : 1000 + g.km.min) : null }));
  rankTable(body, rows, [['k', 'Aplicado', ''], ['n', 'Nº', 'r'], ['red', 'Eficácia', 'r'], ['ctl', 'Segura', 'r']],
    r => '<td><strong>' + r.k + '</strong><br><span class="note">' + r.sub + (r.nValid < 3 ? ' · pouca evidência' : '') + '</span></td><td class="r num">' + r.n + '</td><td class="r num">' + (r.red != null ? nf0.format(r.red * 100) + ' %' : '—') + (r.nValid < r.n ? '<br><span class="note">' + (r.n - r.nValid) + ' sem controle</span>' : '') + '</td><td class="r num">' + (r.km ? (r.km.med != null ? nf0.format(r.km.med) + ' d' : '> ' + nf0.format(r.km.min) + ' d') : '—') + '</td>',
    'Ainda não há aplicações com vistoria depois para medir. Arraste a barra de tempo para frente.');
  foot(body, 'Eficácia de Henderson-Tilton: 1 − (depois ÷ antes no talhão tratado) ÷ (depois ÷ antes nos talhões-controle). Controle = talhão sem aplicação contra o alvo na mesma janela, do mesmo estádio e com nível parecido; vistoria até 10 dias antes → 5 a 14 dias depois. Segura = mediana de dias até voltar ao NC (Kaplan-Meier: quem segue abaixo conta até a data da barra). Doses de exemplo. A decisão é do agrônomo.');
}
function riskRow(x, valid, a) {
  const row = document.createElement('div'), fx = x.up.map(z => z.q.f.fmt(z.v)).concat(x.down.map(z => z.q.f.fmt(z.v) + ' (reduz)')); row.className = 'rk';

    '<span class="m">Hoje ' + fmtV(x.v, a) + ' (vistoria de ' + fmtD(x.day) + ')' + (fx.length ? ' · ' + fx.join(' · ') : ' · nenhum fator de alta ativo') + '</span></button>' +

  row.querySelector('.rkmain').setAttribute('aria-label', x.pid + ', ' + (valid ? probTxt(x.prob) + ' de chance de passar do NC em 7 dias' : 'previsto ' + fmtV(Math.max(0, x.pred), a)) + '. Abrir o talhão.');
  row.querySelector('.rkmain').addEventListener('click', () => select(x.pid));
  row.querySelector('.btn').addEventListener('click', () => { if (draft) delete RXUI.drafts[key]; else RXUI.drafts[key] = true; renderPanel(); });

}
function rxRiscoUI(body, R, a) {
  if (R.cold || !R.risk) return coldBlock(body, R, a);
  const { list, gate, T } = R.risk, ok = list.filter(x => x.st === 'ok').sort((x, y) => y.prob - x.prob), c = [];

  const info = document.createElement('div'); info.className = 'decide';
  info.innerHTML = '<div><strong>' + (T > DAYS ? 'Previsão do tempo' : 'Clima que ocorreu') + ' de ' + fmtD(S.day + 1) + ' a ' + fmtD(T) + ':</strong> ' + c.filter(z => z.quenteSeco).length + ' dia(s) quentes e secos · ' + c.filter(z => z.molhado).length + ' com folha molhada por 8 h ou mais · ' + nf0.format(c.reduce((s, z) => s + z.chuva, 0)) + ' mm de chuva' +
    ' <span class="note">(' + (T > DAYS ? 'previsão sintética' : 'data passada: usa o clima que de fato ocorreu') + ')</span></div>' +
    '<div class="note">' + (gate.ok ? 'Previsão conferida nas 3 semanas anteriores: erro (Brier) de ' + nf2.format(gate.bm) + ', contra ' + nf2.format(gate.bp) + ' de repetir a última vistoria, em ' + gate.n + ' casos.' : 'A previsão ainda não supera repetir a última vistoria' + (gate.n ? ' (' + gate.n + ' casos de teste)' : '') + '. Mostramos a ordem e os fatores, sem probabilidade.') + '</div>';
  body.appendChild(info);
  const sec = document.createElement('div'); sec.className = 'apps'; body.appendChild(sec); ok.forEach(x => sec.appendChild(riskRow(x, gate.ok, a)));
  if (!ok.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nenhum talhão abaixo do NC sem aplicação recente para prever.'; sec.appendChild(e); }
  const grp = (st, title, fn) => { const l = list.filter(z => z.st === st); if (!l.length) return; const p = document.createElement('div'); p.className = 'note'; p.innerHTML = '<strong>' + title + ':</strong> ' + l.map(z => '<button type="button" class="lnk" data-p="' + z.pid + '">' + z.pid + '</button>' + fn(z)).join(' · '); body.appendChild(p); };
  grp('acima', 'Já acima do NC (decidir o controle no talhão)', z => ' ' + fmtV(z.v, a)); grp('ctl', 'Sob efeito de aplicação recente', z => ' desde ' + fmtD(z.app.day)); grp('sem', 'Sem vistoria nos últimos 14 dias', () => '');
  body.querySelectorAll('.lnk[data-p]').forEach(b => b.addEventListener('click', () => select(b.dataset.p)));
  foot(body, 'Risco = chance de a próxima vistoria passar do NC até ' + fmtD(T) + ', pelo modelo do Sobe e desce com o clima do período. Os fatores listados têm evidência forte ou moderada. "Criar vistoria" deixa um rascunho na agenda do monitor e nunca cria O.S.; o controle segue o MIP, com o RT.');
}
function rxMapa(body, R, a) {
  if (R.cold) return coldBlock(body, R, a);
  const Hm = rxHeat(R), lv = r => { const v = Math.abs(r); return v >= .5 ? 5 : v >= .4 ? 4 : v >= .3 ? 3 : v >= .2 ? 2 : 1; };
  const cell = (f, c, span) => { if (c.rho == null) return '<td class="c ns" colspan="' + span + '">—</td>'; const L = lv(c.rho), sig = c.sig;
    return '<td class="c' + (sig ? '' : ' ns') + '" colspan="' + span + '"' + (sig ? ' style="background:var(--' + (c.rho > 0 ? 't' : 'u') + L + ');color:' + (L >= 4 ? '#fff' : '#15201A') + '"' : '') + ' title="' + f.t + ', ' + c.w + ': ' + nf2.format(c.rho) + (sig ? '' : ' (intervalo cruza o zero)') + '">' + (c.rho >= 0 ? '+' : '−') + nf2.format(Math.abs(c.rho)) + '</td>'; };
  let h = '<div class="tblwrap"><table class="heat"><thead><tr><th class="l">Variável</th><th>Semana da vistoria</th><th>8 a 14 dias antes</th><th>15 a 28 dias antes</th></tr></thead><tbody>';
  Hm.forEach(row => { const f = row.f, cells = f.wins === W3 ? row.cells.map(c => cell(f, c, 1)).join('') : f.wins === W2N ? cell(f, row.cells[0], 2) + cell(f, row.cells[1], 1) : cell(f, row.cells[0], 3);
    h += '<tr><td class="l"><span class="tag">' + f.tipo + '</span><br>' + f.t + '</td>' + cells + '</tr>'; });
  const w = document.createElement('div'); w.innerHTML = h + '</tbody></table></div>'; body.appendChild(w);
  const k = document.createElement('div'); k.className = 'keys'; k.innerHTML = '<span><span class="ramp">' + [2, 3, 4, 5].map(i => '<i style="background:var(--t' + i + ')"></i>').join('') + '</span>sobe junto</span><span><span class="ramp">' + [2, 3, 4, 5].map(i => '<i style="background:var(--u' + i + ')"></i>').join('') + '</span>desce junto</span><span><i class="sq" style="box-shadow:inset 0 0 0 1px var(--line)"></i>intervalo de 90 % cruza o zero</span>'; body.appendChild(k);
  foot(body, 'Correlação de Spearman parcial entre cada variável e o crescimento semanal sem controle, descontando nível de partida e estádio. Nutrientes: soma nos 14 dias da janela. A tabela não separa variáveis que andam juntas, como calor, ar seco e umidade baixa: o Sobe e desce faz isso.');
}
function satClimate(day) {
  // variação do índice entre cenas válidas consecutivas, por calor no intervalo e irrigação
  const out = { calorBaixa: [], calorOk: [], semCalor: [] };
  PIVOS.forEach(p => { if (!['adulta', 'media'].includes(p.stage)) return; const sc = SAT[p.id].scenes.filter(s => s.ok && s.day <= day);
    for (let i = 1; i < sc.length; i++) { const d = sc[i][S.idx].med - sc[i - 1][S.idx].med, cl = climaBetween(sc[i - 1].day, sc[i].day);
      if (cl.cal >= 2) (WATER[p.id].suff < .8 ? out.calorBaixa : out.calorOk).push(d); else out.semCalor.push(d); } });
  return out;
}
function renderVigorRanking() {
  const body = panelHead('<h3>O que melhorou o vigor (' + S.idx + ')</h3><div class="sub">Resposta de cada adubação (cena antes → 10 a 25 dias depois, menos a variação dos pivôs do mesmo estádio) e efeito do clima e da água, até ' + fmtD(S.day) + '.</div>');
  const evs = EVENTS.filter(e => e.kind === 'adub').map(e => ({ e, ef: vigorEffect(e, S.idx) })).filter(x => x.ef && x.ef.rel != null && x.ef.after.day <= S.day); const ins = [];
  const byProg = {}; evs.forEach(x => (byProg[x.e.progNome] = byProg[x.e.progNome] || []).push(x));
  const best = Object.entries(byProg).filter(([, v]) => v.length >= 2).map(([k, v]) => ({ k, n: v.length, rel: median(v.map(x => x.ef.rel)) })).sort((a, b) => b.rel - a.rel)[0];
  if (best && best.rel >= .01) ins.push('<strong>' + best.k + '</strong> teve a melhor resposta mediana: <strong class="num">' + signed2(best.rel) + '</strong> de ' + S.idx + ' em ' + best.n + ' adubações, comparado aos pivôs do mesmo estádio.');
  const adultas = PIVOS.filter(p => p.stage === 'adulta'), now = p => { const q = satAt(p.id, S.day); return q.state === 'ok' ? q.v : null; };
  const reg = adultas.filter(p => PLAN[p.id] !== 'irreg').map(now).filter(v => v != null), irr = adultas.filter(p => PLAN[p.id] === 'irreg').map(now).filter(v => v != null);
  if (reg.length && irr.length && median(reg) - median(irr) > .008) ins.push('Pivôs em produção adubados a cada 14 dias estão com ' + S.idx + ' mediano <strong class="num">' + nf2.format(median(reg)) + '</strong>; os com intervalo maior que 21 dias (' + adultas.filter(p => PLAN[p.id] === 'irreg').map(p => p.id).join(', ') + '), <strong class="num">' + nf2.format(median(irr)) + '</strong>.');
  const sc = satClimate(S.day), mb = median(sc.calorBaixa), mo = median(sc.calorOk), ms = median(sc.semCalor);
  if (sc.calorBaixa.length >= 2 && sc.calorOk.length >= 2 && mo - mb > .005) ins.push('Clima: entre cenas com 2 ou mais dias acima de 35 °C, pivôs com irrigação abaixo de 80 % variaram <strong class="num">' + signed2(mb) + '</strong> de ' + S.idx + '; os com irrigação completa, <strong class="num">' + signed2(mo) + '</strong>. Sem calor, a variação mediana foi <strong class="num">' + signed2(ms) + '</strong>.');
  insightsList(body, ins);
  groupSeg(body, [['prod', 'Programa'], ['calda', 'Dose de N'], ['entrada', 'Estádio'], ['clima', 'Calor e água']]);
  const groups = {};
  if (S.group === 'clima') { [['Calor ≥ 35 °C · irrigação abaixo de 80 %', sc.calorBaixa], ['Calor ≥ 35 °C · irrigação completa', sc.calorOk], ['Sem calor', sc.semCalor]].forEach(([k, arr]) => { if (arr.length) groups[k] = { k, sub: 'variação entre cenas consecutivas', rel: arr, d: arr }; }); }
  else evs.forEach(({ e, ef }) => { const nN = e.items.reduce((s, it) => s + (it.nut.N || 0), 0);
    const k = S.group === 'prod' ? e.progNome : S.group === 'calda' ? 'N ' + nf1.format(nN) + ' kg/ha por aplicação' : 'Pivôs ' + STAGE_TXT[P(e.pid).stage];
    const G = groups[k] = groups[k] || { k, sub: e.via, rel: [], d: [], pids: new Set() }; G.rel.push(ef.rel); G.d.push(ef.d); G.pids.add(e.pid); });
  const levelVsStage = pids => { const vals = [...pids].map(id => { const p = P(id), q = satAt(id, S.day); if (q.state !== 'ok') return null; const st = median(PIVOS.filter(x => x.stage === p.stage).map(x => satAt(x.id, S.day)).filter(z => z.state === 'ok').map(z => z.v)); return st != null ? q.v - st : null; }).filter(v => v != null); return median(vals); };
  const rows = Object.values(groups).map(G => ({ k: G.k, sub: G.sub, n: G.rel.length, red: median(G.rel), ctl: S.group === 'clima' ? median(G.d) : levelVsStage(G.pids || []) }));
  rankTable(body, rows, [['k', 'Manejo ou condição', ''], ['n', 'Nº', 'r'], ['red', S.group === 'clima' ? 'Variação' : 'Resposta', 'r'], ['ctl', S.group === 'clima' ? 'Bruta' : 'Nível hoje', 'r']],
    r => '<td><strong>' + r.k + '</strong><br><span class="note">' + r.sub + (r.n < 3 ? ' · pouca evidência' : '') + '</span></td><td class="r num">' + r.n + '</td><td class="r num">' + signed2(r.red) + '</td><td class="r num">' + (r.ctl != null ? signed2(r.ctl) : '—') + '</td>',
    'Ainda não há adubações com cena sem nuvem depois. Arraste a barra de tempo para frente.');
  foot(body, 'Resposta = variação do pivô depois da adubação menos a dos pivôs do mesmo estádio no mesmo período, para separar o efeito do clima. Nível hoje = índice dos pivôs do grupo menos a mediana do estádio na data. Use NDRE para nutrição de nitrogênio. Associação, não prova de causa; nuvem, estádio, água e calor também mudam o índice. Doses de exemplo. A decisão é do agrônomo.');
}
function insightsList(body, ins) { if (!ins.length) return; const ul = document.createElement('ul'); ul.className = 'insights'; ins.forEach(t => { const li = document.createElement('li'); li.innerHTML = t; ul.appendChild(li); }); body.appendChild(ul); }
function groupSeg(body, items) { if (!items.some(i => i[0] === S.group)) S.group = items[0][0];
  const grp = document.createElement('div'); grp.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:8px'; grp.innerHTML = '<span class="note">Agrupar por</span>';
  const sg = document.createElement('div'); sg.className = 'seg'; sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', 'Agrupar por');
  items.forEach(([k, t]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(S.group === k)); b.addEventListener('click', () => { S.group = k; renderPanel(); }); sg.appendChild(b); });

function rankTable(body, rows, cols, rowHtml, emptyTxt) {

  body.appendChild(wrap);
  wrap.querySelectorAll('th button').forEach(b => b.addEventListener('click', () => { const ck = b.dataset.k; S.sort = { k: ck, dir: S.sort.k === ck ? -S.sort.dir : (ck === 'k' ? 1 : -1) }; renderPanel(); }));
}
function foot(body, t) { const n = document.createElement('div'); n.className = 'note'; n.textContent = t; body.appendChild(n); }
