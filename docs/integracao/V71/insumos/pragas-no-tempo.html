<title>Pragas e doenças no tempo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mapa da fazenda com a linha do tempo de manejo e clima embaixo; painel do talhão à direita (embaixo no celular). */
:root {
  --bg: #F4F6F3; --surface: #FFFFFF; --surface-2: #F2F5F1; --line: #E1E7E2;
  --ink: #15201A; --ink-2: #3E4A43; --muted: #65736A;
  --accent: #1E7A4C; --accent-weak: #E4F3E9;
  --ok: #2E7A4F; --warn: #946210; --bad: #A3261B; --nodata: #66716B; --nocrop: #8A7C5C; --water: #3F6E8C;
  --field-a: #7C8C55; --field-b: #6E7E4A; --field-line: rgba(255,255,255,.18);
  --chart-line: #1E7A4C; --chart-fill: rgba(30,122,76,.12); --band: rgba(30,122,76,.10); --global: #65736A; --nc: #A3261B;
  --def: #1F5F8B; --adub: #7B4FA0; --oper: #5B6660; --rain: #8DB9D8; --irr: #2A9BAE; --fav: #A3261B;
  --c1: #E4002B; --c2: #FF6A00; --c3: #FFD500; --c4: #B5E61D; --c5: #3FBF2A; --c6: #0B7A1E;
  --t1: #FCEBCF; --t2: #F8C98B; --t3: #F09E50; --t4: #DA6A2C; --t5: #B33A15;
  --u1: #E7F1F8; --u2: #BDD9EC; --u3: #8DBBDC; --u4: #5A95C3; --u5: #2D6C9C;
  --shadow: 0 12px 28px -14px rgba(21,32,26,.35);
  --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1611; --surface: #161F19; --surface-2: #1B261F; --line: #29362E; --ink: #E5ECE6; --ink-2: #C3CEC6; --muted: #93A398;
    --accent: #4FB383; --accent-weak: #1D3527; --ok: #2F7D52; --warn: #946210; --bad: #B03328; --nodata: #5C6862; --nocrop: #7A6D50; --water: #355E78;
    --field-a: #4A5734; --field-b: #414D2E; --field-line: rgba(255,255,255,.10);
    --chart-line: #4FB383; --chart-fill: rgba(79,179,131,.16); --band: rgba(79,179,131,.14); --global: #93A398; --nc: #E07A6E;
    --def: #6FA8D6; --adub: #B48AD8; --oper: #9AA8A0; --rain: #4E7FA3; --irr: #48B9CB; --fav: #E07A6E;
    --shadow: 0 12px 28px -14px rgba(0,0,0,.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1611; --surface: #161F19; --surface-2: #1B261F; --line: #29362E; --ink: #E5ECE6; --ink-2: #C3CEC6; --muted: #93A398;
  --accent: #4FB383; --accent-weak: #1D3527; --ok: #2F7D52; --warn: #946210; --bad: #B03328; --nodata: #5C6862; --nocrop: #7A6D50; --water: #355E78;
  --field-a: #4A5734; --field-b: #414D2E; --field-line: rgba(255,255,255,.10);
  --chart-line: #4FB383; --chart-fill: rgba(79,179,131,.16); --band: rgba(79,179,131,.14); --global: #93A398; --nc: #E07A6E;
  --def: #6FA8D6; --adub: #B48AD8; --oper: #9AA8A0; --rain: #4E7FA3; --irr: #48B9CB; --fav: #E07A6E;
  --shadow: 0 12px 28px -14px rgba(0,0,0,.6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 24px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; margin-bottom: 12px; }
.crumb { font-size: 12px; color: var(--muted); font-weight: 600; }
h1 { font-size: 22px; line-height: 1.2; margin: 2px 0 0; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
.ctx { display: flex; flex-wrap: wrap; gap: 6px; }
.ctx span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.ctx b { color: var(--muted); font-weight: 600; margin-right: 4px; }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 410px); gap: 12px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.mapcard { overflow: visible; }
.mapcard .bar { border-radius: 14px 14px 0 0; }

.bar { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.barrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.lbl { font-size: 12px; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 32px; }
.seg button[aria-checked="true"], .seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.seg.big button { font-size: 13.5px; padding: 7px 14px; }
.measure { font-size: 12.5px; color: var(--muted); }
.measure b { color: var(--ink-2); }

.map { position: relative; container-type: inline-size; aspect-ratio: 16 / 7.4; width: 100%;
  background:
    linear-gradient(90deg, var(--field-line) 1px, transparent 1px) 0 0 / 16.66% 100%,
    linear-gradient(0deg, var(--field-line) 1px, transparent 1px) 0 0 / 100% 25%,
    radial-gradient(circle at 20% 30%, var(--field-a) 0 2px, transparent 3px) 0 0 / 14px 14px,
    radial-gradient(circle at 70% 60%, var(--field-b) 0 2px, transparent 3px) 0 0 / 11px 11px,
    var(--field-a); }
.lake { position: absolute; border-radius: 50%; background: var(--water); opacity: .9; }
.pv { position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; border-radius: 50%; border: 2px solid rgba(255,255,255,.85);
  display: grid; place-content: center; text-align: center; color: #fff; cursor: pointer; padding: 0; line-height: 1.12;
  text-shadow: 0 1px 2px rgba(0,0,0,.55); transition: background-color .25s ease, box-shadow .2s ease; }
.pv.dark { color: #15201A; text-shadow: 0 0 3px rgba(255,255,255,.9); }
.pv .id { font-weight: 800; font-size: clamp(9px, 1.55cqw, 15px); }
.pv .v { font-weight: 700; font-size: clamp(8px, 1.2cqw, 12.5px); }
.pv .s { font-weight: 600; font-size: clamp(7px, .95cqw, 11px); opacity: .95; }
.pv.ok { background: var(--ok); } .pv.warn { background: var(--warn); } .pv.bad { background: var(--bad); }
.pv.nodata { background: repeating-linear-gradient(135deg, var(--nodata) 0 6px, color-mix(in srgb, var(--nodata) 80%, #fff) 6px 9px); }
.pv.cloud { background: repeating-linear-gradient(135deg, #9E9E9E 0 6px, #C9C9C9 6px 9px); color: #15201A; text-shadow: 0 0 3px rgba(255,255,255,.9); }
.pv.nocrop { background: var(--nocrop); cursor: default; }
.pv[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px rgba(255,255,255,.7); z-index: 2; }
@media (hover: hover) { .pv:not(.nocrop):hover { box-shadow: 0 0 0 3px rgba(255,255,255,.9); } }
.badges { position: absolute; top: -5px; right: -6px; display: flex; gap: 2px; }
.badge { width: clamp(15px, 2.2cqw, 20px); height: clamp(15px, 2.2cqw, 20px); border-radius: 50%; background: var(--surface); display: grid; place-items: center; border: 2px solid; }
.badge svg { width: 62%; height: 62%; fill: currentColor; }
.maptip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); max-width: 250px; text-shadow: none; }
.maptip b { display: block; }
.demo { position: absolute; right: 8px; bottom: 8px; font-size: 11px; color: #fff; background: rgba(0,0,0,.4); padding: 2px 8px; border-radius: 999px; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; }
.legend i.hatch { background: repeating-linear-gradient(135deg, #9E9E9E 0 3px, #C9C9C9 3px 5px); }

.time { padding: 12px 14px 14px; border-top: 1px solid var(--line); }
.timehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 6px; }
.now { font-size: 13px; color: var(--ink-2); }
.now strong { font-size: 15px; color: var(--ink); }
.ctrls { display: flex; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); color: #fff; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 2px 0 6px; font-size: 12px; color: var(--muted); }
.tg { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px 4px 5px; font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--ink-2); min-height: 30px; }
.tg[aria-pressed="false"] { opacity: .5; }
.tg .ic { width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; border: 2px solid; }
.tg .ic svg { width: 11px; height: 11px; fill: currentColor; }

.chartbox { position: relative; }
.chartwrap { position: relative; touch-action: none; user-select: none; cursor: ew-resize; border-radius: 10px; }
.chartwrap:focus-visible { outline-offset: 4px; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.ax { stroke: var(--line); stroke-width: 1; }
.grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.ncl { stroke: var(--nc); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.gl { stroke: var(--global); stroke-width: 2; stroke-dasharray: 5 4; fill: none; }
.ml { stroke: var(--chart-line); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.mf { fill: var(--chart-fill); stroke: none; }
.bandf { fill: var(--band); stroke: none; }
.rainb { fill: var(--rain); } .irrb { fill: var(--irr); } .favb { fill: var(--fav); }
.evline { stroke-width: 1; stroke-dasharray: 2 3; opacity: .5; }
.cursor { stroke: var(--ink); stroke-width: 1.5; }
.knob { fill: var(--ink); }
.knobtxt { fill: var(--surface); font-weight: 800; font-size: 11px; }
.hoverline { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 3; }
.pt { fill: var(--surface); stroke: var(--chart-line); stroke-width: 2; }
.pt.bad { stroke: var(--nc); }
.pt.cloud { fill: var(--surface); stroke: #9E9E9E; stroke-dasharray: 2 2; }
.scn { stroke: var(--muted); stroke-width: 1; }
.evt { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid; background: var(--surface); display: grid; place-items: center; padding: 0; cursor: pointer; z-index: 3; }
.evt svg { width: 12px; height: 12px; fill: currentColor; }
.evt .n { position: absolute; top: -8px; right: -9px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: 9.5px; font-weight: 800; display: grid; place-items: center; padding: 0 3px; }
.evt[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px currentColor; }
.evt.def { border-color: var(--def); color: var(--def); } .evt.adub { border-color: var(--adub); color: var(--adub); }
.lanelab { position: absolute; left: 0; font-size: 10.5px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
.tip { position: absolute; z-index: 6; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: var(--shadow); min-width: 180px; max-width: 270px; }
.tip b { display: block; margin-bottom: 2px; }
.tip .row, .pop .row { display: flex; justify-content: space-between; gap: 12px; color: var(--ink-2); }
.pop { position: absolute; z-index: 8; width: min(340px, calc(100% - 8px)); max-height: 420px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px 12px 12px; font-size: 12.5px; display: grid; gap: 8px; cursor: default; }
.pop h4 { margin: 0; font-size: 13.5px; font-weight: 800; padding-right: 26px; }
.pop .x { position: absolute; top: 6px; right: 6px; border: 0; background: transparent; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--muted); }
.pop .x:hover { background: var(--surface-2); }
.pop .ev { display: grid; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.pop h4 + .ev { border-top: 0; padding-top: 0; }
.pop .k { color: var(--muted); }
.pop .k.warn { color: var(--warn); font-weight: 600; }
.pop table { width: 100%; border-collapse: collapse; }
.pop td { padding: 2px 0; vertical-align: top; }
.pop td.r { text-align: right; white-space: nowrap; padding-left: 8px; }
.pop .eff { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; color: var(--ink-2); }
.pop .eff b { color: var(--ink); }
.pop .go { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 2px 0; cursor: pointer; }
.keys { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-top: 6px; }
.keys span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }
.sw.d { border-top-style: dashed; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.ramp { display: inline-flex; } .ramp i { width: 8px; height: 10px; display: inline-block; }

.panel { position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); }
.panel .ph { padding: 14px 14px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.panel h3 { margin: 0; font-size: 16px; font-weight: 800; }
.panel .sub { font-size: 12.5px; color: var(--muted); }
.panel .pb { padding: 12px 14px 14px; display: grid; gap: 12px; }
.back { justify-self: start; border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 4px 0; cursor: pointer; font-size: 13px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.state { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.insights { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.insights li { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; font-size: 13px; color: var(--ink-2); }
.insights li strong { color: var(--ink); }
.note { font-size: 12px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tblwrap { overflow-x: auto; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 700; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th button { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; cursor: pointer; text-transform: inherit; letter-spacing: inherit; }
.tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.r, .tbl th.r { text-align: right; }
.apps { display: grid; gap: 8px; }
.app { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: start; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; cursor: pointer; }
.app:hover { border-color: var(--accent); }
.app .d { font-weight: 800; font-size: 13px; }
.app .p { font-weight: 700; font-size: 13px; }
.app .m { grid-column: 2 / 4; font-size: 12px; color: var(--muted); }
.app .e { font-weight: 800; font-size: 13px; text-align: right; }
.app .e.good { color: var(--ok); } .app .e.weak { color: var(--warn); }
.app .ctl { grid-column: 2 / 4; font-size: 12px; color: var(--ink-2); }
.decide { display: grid; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 10px 11px; }
.empty { color: var(--muted); font-size: 13px; }
h5 { margin: 0; font-size: 13px; font-weight: 800; }

@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } .panel { position: static; } }
@media (max-width: 560px) { .map { aspect-ratio: 4 / 3.3; } .pv .s { display: none; } h1 { font-size: 19px; } }
@media (prefers-reduced-motion: reduce) { .pv { transition: none; } }
</style>

<div class="top">
  <div>
    <div class="crumb">Mapa › <span id="crumbLayer">Pragas e doenças</span></div>
    <h1>Mapa da fazenda</h1>
  </div>
  <div class="ctx" aria-label="Contexto">
    <span><b>Fazenda</b>Lagoa Grande</span><span><b>Safra</b>2026/27</span><span><b>Cultura</b>Mamão</span>
  </div>
</div>

<div class="layout">
  <section class="card mapcard" aria-label="Mapa com a evolução da lavoura, o manejo e o clima">
    <div class="bar">
      <div class="barrow"><div class="seg big" role="radiogroup" aria-label="Camada" id="layers"></div></div>
      <div class="barrow">
        <span class="lbl" id="subsLbl">Alvo</span><div class="seg" role="radiogroup" aria-label="Alvo ou índice" id="subs"></div>
        <span class="lbl" id="scaleLbl">Contraste</span><div class="seg" role="radiogroup" aria-label="Contraste" id="scale"></div>
        <div class="measure" id="measure"></div>
      </div>
    </div>
    <div class="map" id="map"></div>
    <div class="legend" id="legend" aria-label="Legenda do mapa"></div>
    <div class="time">
      <div class="timehead">
        <div class="now" id="now" aria-live="polite"></div>
        <div class="ctrls">
          <button class="btn" id="play" type="button" aria-label="Reproduzir a evolução"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg><span>Reproduzir</span></button>
          <button class="btn" id="today" type="button">Hoje</button>
        </div>
      </div>
      <div class="toggles" id="toggles" role="group" aria-label="O que mostrar na linha do tempo"></div>
      <div class="chartbox" id="tlbox">
        <div class="chartwrap" id="tl" tabindex="0" role="slider" aria-label="Data. Setas mudam um dia; Shift muda uma semana."></div>
      </div>
      <div class="keys" id="tlkeys" aria-hidden="true"></div>
    </div>
  </section>
  <aside class="card panel" id="panel" aria-live="polite"></aside>
</div>

<script>
(() => {
'use strict';
// ================= base sintética · Lagoa Grande · mamão =================
const START = new Date(2026, 6, 1);   // 01/07/2026
const DAYS = 86;                      // 25/09/2026, data da última cena de satélite
const RAINMM = { 18: 22, 19: 9, 37: 14, 38: 31, 39: 6, 52: 18, 66: 11, 67: 25, 79: 16 };
const nf0 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 0 });
const nf1 = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 1 });
const nf2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dDate = d => { const x = new Date(START); x.setDate(x.getDate() + d); return x; };
const fmtD = d => { const x = dDate(d); return String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0'); };
const median = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const signed2 = v => (Math.abs(v) < .005 ? '' : v > 0 ? '+' : '−') + nf2.format(Math.abs(v));
const pct = v => (v >= 0 ? '+' : '−') + nf0.format(Math.abs(v * 100)) + ' %';

  else if (q.state === 'ok') { const { c } = satClass(q.v); chip = '<span class="chip"><i style="background:var(--c' + (c + 1) + ')"></i>' + S.idx + ' ' + nf2.format(q.v) + ' · ' + CLS_TXT[c].toLowerCase() + ' · cena de ' + fmtD(q.day) + '</span>'; }
  else chip = '<span class="chip"><i style="background:#9E9E9E"></i>' + (q.state === 'cloud' ? 'Nuvem na cena de ' + fmtD(q.day) : 'Sem imagem válida em 15 dias') + '</span>';
  const body = panelHead('<button class="back" type="button">‹ Todos os talhões</button><h3>' + p.id + ' · vigor e manejo</h3><div class="sub">' + nf1.format(p.ha) + ' ha · Mamão Formosa ' + STAGE_TXT[p.stage] + (NEED[p.stage] ? ' · irrigação cobre ' + nf0.format(W.suff * 100) + ' % da necessidade' : '') + '</div><div class="state">' + chip + '</div>');
  const box = chartIn(body, p.id, '<span><i class="sw" style="border-color:var(--chart-line)"></i>' + p.id + ' (mediana da cena)</span><span><i class="sq" style="background:var(--band)"></i>P10 a P90 do pivô</span><span><i class="sw d" style="border-color:var(--global)"></i>Pivôs ' + STAGE_TXT[p.stage] + '</span><span>○ cena com nuvem</span>');

  const h = document.createElement('h5'); h.innerHTML = 'Adubações e resposta do vigor <span class="note">· cena antes → 10 a 25 dias depois</span>'; body.appendChild(h);

  [...evs].reverse().forEach(e => {

    const b = document.createElement('button'); b.type = 'button'; b.className = 'app';
    b.innerHTML = '<span class="d num">' + fmtD(e.day) + '</span><span class="p">' + e.items.map(i => i.n).join(' + ') + '</span><span class="e num ' + (known && ef.rel != null ? (ef.rel > .005 ? 'good' : 'weak') : '') + '">' + (known ? signed2(ef.rel != null ? ef.rel : ef.d) : (e.kind === 'oper' ? '' : 'aguarda cena')) + '</span>' +
      '<span class="m">' + e.via + (nN ? ' · N ' + nf1.format(nN) + ' kg/ha' : '') + ' · ' + e.items.map(i => dose(i.dose) + ' ' + i.du + '/ha').join(' + ') + '</span>' +
      (known ? '<span class="ctl num">' + S.idx + ' ' + nf2.format(ef.before[S.idx].med) + ' → ' + nf2.format(ef.after[S.idx].med) + (ef.rel != null ? ' · ' + signed2(ef.rel) + ' em relação aos pivôs ' + STAGE_TXT[p.stage] : '') + '</span>' : '');
    b.setAttribute('aria-label', fmtD(e.day) + ', ' + e.items.map(i => i.n).join(' e ') + '. Abrir insumos, doses e efeito.');
    b.addEventListener('click', () => openIcon(box, 'adub', e.day)); list.appendChild(b);

}
// ---- rankings: o que funcionou ----
function pestAppsUntil(day) { const out = []; PIVOS.forEach(p => { const s = PEST[S.alvo][p.id]; if (!s) return; s.apps.forEach(ap => { if (ap.after && ap.after.day <= day && ap.red != null) out.push(Object.assign({ pid: p.id }, ap)); }); }); return out; }
function pestClimate(day) {
  // crescimento semanal entre vistorias sem aplicação (nem resíduo de 10 dias), separado pelo clima do intervalo
  const a = A(), rows = { fav: [], nfav: [] };
  PIVOS.forEach(p => { const s = PEST[S.alvo][p.id]; if (!s) return; for (let i = 1; i < s.obs.length; i++) { const o1 = s.obs[i - 1], o2 = s.obs[i]; if (o2.day > day || o1.v < (a.un === '%' ? .8 : .3)) continue;
    if (s.apps.some(ap => ap.day > o1.day - 10 && ap.day <= o2.day)) continue;
    const g = Math.pow(o2.v / o1.v, 7 / (o2.day - o1.day)) - 1; const cl = climaBetween(o1.day, o2.day); const n = a.id === 'antrac' ? cl.mol : cl.qs;
    (n >= (a.id === 'antrac' ? 1 : 3) ? rows.fav : rows.nfav).push(g); } });
  return rows;
}
function renderPestRanking() {
  const a = A();
  const body = panelHead('<h3>O que reduziu ' + a.nome.toLowerCase() + '</h3><div class="sub">Aplicações com vistoria antes e depois e efeito do clima, até ' + fmtD(S.day) + '. Clique num talhão para ver a evolução com os ícones de cada aplicação.</div>');
  const apps = pestAppsUntil(S.day), ins = [];
  if (apps.length) {
    const byProd = {}; apps.forEach(ap => (byProd[ap.prod.c] = byProd[ap.prod.c] || []).push(ap));
    const best = Object.entries(byProd).filter(([, v]) => v.length >= 2).map(([k, v]) => ({ k, n: v.length, red: median(v.map(x => x.red)), g: v[0].prod.g })).sort((x, y) => y.red - x.red)[0];
    if (best) ins.push('<strong>' + best.k + '</strong> (' + best.g + ') teve a maior redução mediana: <strong class="num">' + fmtRed(best.red) + '</strong> em ' + best.n + ' aplicações.');
    for (const [k, v] of Object.entries(byProd)) { const b = v.filter(x => x.eq === 'b100'), at = v.filter(x => x.eq !== 'b100'); const rb = median(b.map(x => x.red)), ra = median(at.map(x => x.red));
      if (b.length && at.length && ra - rb > .1) { ins.push('Com <strong>' + k + '</strong>, a barra a 100 L/ha teve redução mediana de <strong class="num">' + fmtRed(rb) + '</strong>; o atomizador, <strong class="num">' + fmtRed(ra) + '</strong>. A calda e o equipamento contam.'); break; } }
    for (const [k, v] of Object.entries(byProd)) { const first = v.filter(x => x.consec === 0 && x.rep === 1), sq = v.filter(x => x.consec >= 2); const rf = median(first.map(x => x.red)), rs = median(sq.map(x => x.red));
      if (first.length && sq.length && rf - rs > .15) { ins.push('<strong>' + k + '</strong> repetido em sequência caiu de <strong class="num">' + fmtRed(rf) + '</strong> na 1ª entrada para <strong class="num">' + fmtRed(rs) + '</strong> da 3ª seguida em diante. Sinal de resistência: rotacione o mecanismo de ação.'); break; } }
  }
  const pc = pestClimate(S.day), gf = median(pc.fav), gn = median(pc.nfav);
  if (pc.fav.length >= 3 && pc.nfav.length >= 3 && Math.abs(gf - gn) > .05) ins.push('Clima: em intervalos com ' + (a.id === 'antrac' ? '1 ou mais dias de folha molhada por 8 h ou mais' : '3 ou mais dias quentes e secos (≥ 32 °C e UR < 50 %)') + ', ' + a.nome.toLowerCase() + ' variou <strong class="num">' + pct(gf) + '</strong> por semana sem controle; nos demais, <strong class="num">' + pct(gn) + '</strong> (' + pc.fav.length + ' e ' + pc.nfav.length + ' intervalos sem aplicação).');
  insightsList(body, ins);
  groupSeg(body, [['prod', 'Produto'], ['calda', 'Produto e calda'], ['entrada', 'Sequência'], ['clima', 'Clima da semana']]);
  const groups = {};
  apps.forEach(ap => { let k; if (S.group === 'prod') k = ap.prod.c; else if (S.group === 'calda') k = ap.prod.c + ' · ' + EQ[ap.eq].c; else if (S.group === 'entrada') k = ap.prod.c + ' · ' + (ap.consec >= 2 ? '3ª seguida ou mais' : ap.consec === 1 ? '2ª seguida' : 'em rotação');
    else { const cl = climaBetween(ap.day, ap.after.day); k = a.id === 'antrac' ? (cl.mol ? 'Com molhamento até a vistoria' : 'Sem molhamento até a vistoria') : (cl.qs >= 3 ? 'Semana quente e seca depois' : 'Semana amena depois'); }
    const G = groups[k] = groups[k] || { k, sub: S.group === 'clima' ? 'todas as aplicações do alvo' : ap.prod.g + ' · ' + dose(ap.prod.dose) + ' ' + ap.prod.du + '/ha', red: [], ctl: [], open: 0 };
    G.red.push(ap.red); if (ap.backDay != null && ap.backDay <= S.day) G.ctl.push(ap.backDay - ap.day); else G.open++; });
  const rows = Object.values(groups).map(G => ({ k: G.k, sub: G.sub, n: G.red.length, red: median(G.red), ctl: median(G.ctl), open: G.open }));
  rankTable(body, rows, [['k', 'Aplicado', ''], ['n', 'Nº', 'r'], ['red', 'Redução', 'r'], ['ctl', 'Volta ao NC', 'r']],
    r => '<td><strong>' + r.k + '</strong><br><span class="note">' + r.sub + (r.n < 3 ? ' · pouca evidência' : '') + '</span></td><td class="r num">' + r.n + '</td><td class="r num">' + fmtRed(r.red) + '</td><td class="r num">' + (r.ctl != null ? 'em ' + nf0.format(r.ctl) + ' d' : '—') + (r.open ? '<br><span class="note">' + r.open + ' segue' + (r.open > 1 ? 'm' : '') + ' abaixo</span>' : '') + '</td>',
    'Ainda não há aplicações com vistoria depois para medir o efeito. Arraste a barra de tempo para frente.');
  foot(body, 'Associação observada nas vistorias, não prova de causa: dose, clima, fase da praga e cobertura também mudam o resultado. Condição favorável de exemplo: ' + a.favTxt + '. Doses de exemplo. A decisão é do agrônomo.');
}
function satClimate(day) {
  // variação do índice entre cenas válidas consecutivas, por calor no intervalo e irrigação
  const out = { calorBaixa: [], calorOk: [], semCalor: [] };
  PIVOS.forEach(p => { if (!['adulta', 'media'].includes(p.stage)) return; const sc = SAT[p.id].scenes.filter(s => s.ok && s.day <= day);
    for (let i = 1; i < sc.length; i++) { const d = sc[i][S.idx].med - sc[i - 1][S.idx].med, cl = climaBetween(sc[i - 1].day, sc[i].day);
      if (cl.cal >= 2) (WATER[p.id].suff < .8 ? out.calorBaixa : out.calorOk).push(d); else out.semCalor.push(d); } });
  return out;
}
function renderVigorRanking() {
  const body = panelHead('<h3>O que melhorou o vigor (' + S.idx + ')</h3><div class="sub">Resposta de cada adubação (cena antes → 10 a 25 dias depois, menos a variação dos pivôs do mesmo estádio) e efeito do clima e da água, até ' + fmtD(S.day) + '.</div>');
  const evs = EVENTS.filter(e => e.kind === 'adub').map(e => ({ e, ef: vigorEffect(e, S.idx) })).filter(x => x.ef && x.ef.rel != null && x.ef.after.day <= S.day); const ins = [];
  const byProg = {}; evs.forEach(x => (byProg[x.e.progNome] = byProg[x.e.progNome] || []).push(x));
  const best = Object.entries(byProg).filter(([, v]) => v.length >= 2).map(([k, v]) => ({ k, n: v.length, rel: median(v.map(x => x.ef.rel)) })).sort((a, b) => b.rel - a.rel)[0];
  if (best && best.rel >= .01) ins.push('<strong>' + best.k + '</strong> teve a melhor resposta mediana: <strong class="num">' + signed2(best.rel) + '</strong> de ' + S.idx + ' em ' + best.n + ' adubações, comparado aos pivôs do mesmo estádio.');
  const adultas = PIVOS.filter(p => p.stage === 'adulta'), now = p => { const q = satAt(p.id, S.day); return q.state === 'ok' ? q.v : null; };
  const reg = adultas.filter(p => PLAN[p.id] !== 'irreg').map(now).filter(v => v != null), irr = adultas.filter(p => PLAN[p.id] === 'irreg').map(now).filter(v => v != null);
  if (reg.length && irr.length && median(reg) - median(irr) > .008) ins.push('Pivôs em produção adubados a cada 14 dias estão com ' + S.idx + ' mediano <strong class="num">' + nf2.format(median(reg)) + '</strong>; os com intervalo maior que 21 dias (' + adultas.filter(p => PLAN[p.id] === 'irreg').map(p => p.id).join(', ') + '), <strong class="num">' + nf2.format(median(irr)) + '</strong>.');
  const sc = satClimate(S.day), mb = median(sc.calorBaixa), mo = median(sc.calorOk), ms = median(sc.semCalor);
  if (sc.calorBaixa.length >= 2 && sc.calorOk.length >= 2 && mo - mb > .005) ins.push('Clima: entre cenas com 2 ou mais dias acima de 35 °C, pivôs com irrigação abaixo de 80 % variaram <strong class="num">' + signed2(mb) + '</strong> de ' + S.idx + '; os com irrigação completa, <strong class="num">' + signed2(mo) + '</strong>. Sem calor, a variação mediana foi <strong class="num">' + signed2(ms) + '</strong>.');
  insightsList(body, ins);
  groupSeg(body, [['prod', 'Programa'], ['calda', 'Dose de N'], ['entrada', 'Estádio'], ['clima', 'Calor e água']]);
  const groups = {};
  if (S.group === 'clima') { [['Calor ≥ 35 °C · irrigação abaixo de 80 %', sc.calorBaixa], ['Calor ≥ 35 °C · irrigação completa', sc.calorOk], ['Sem calor', sc.semCalor]].forEach(([k, arr]) => { if (arr.length) groups[k] = { k, sub: 'variação entre cenas consecutivas', rel: arr, d: arr }; }); }
  else evs.forEach(({ e, ef }) => { const nN = e.items.reduce((s, it) => s + (it.nut.N || 0), 0);
    const k = S.group === 'prod' ? e.progNome : S.group === 'calda' ? 'N ' + nf1.format(nN) + ' kg/ha por aplicação' : 'Pivôs ' + STAGE_TXT[P(e.pid).stage];
    const G = groups[k] = groups[k] || { k, sub: e.via, rel: [], d: [], pids: new Set() }; G.rel.push(ef.rel); G.d.push(ef.d); G.pids.add(e.pid); });
  const levelVsStage = pids => { const vals = [...pids].map(id => { const p = P(id), q = satAt(id, S.day); if (q.state !== 'ok') return null; const st = median(PIVOS.filter(x => x.stage === p.stage).map(x => satAt(x.id, S.day)).filter(z => z.state === 'ok').map(z => z.v)); return st != null ? q.v - st : null; }).filter(v => v != null); return median(vals); };

  rankTable(body, rows, [['k', 'Manejo ou condição', ''], ['n', 'Nº', 'r'], ['red', S.group === 'clima' ? 'Variação' : 'Resposta', 'r'], ['ctl', S.group === 'clima' ? 'Bruta' : 'Nível hoje', 'r']],
    r => '<td><strong>' + r.k + '</strong><br><span class="note">' + r.sub + (r.n < 3 ? ' · pouca evidência' : '') + '</span></td><td class="r num">' + r.n + '</td><td class="r num">' + signed2(r.red) + '</td><td class="r num">' + (r.ctl != null ? signed2(r.ctl) : '—') + '</td>',
    'Ainda não há adubações com cena sem nuvem depois. Arraste a barra de tempo para frente.');
  foot(body, 'Resposta = variação do pivô depois da adubação menos a dos pivôs do mesmo estádio no mesmo período, para separar o efeito do clima. Nível hoje = índice dos pivôs do grupo menos a mediana do estádio na data. Use NDRE para nutrição de nitrogênio. Associação, não prova de causa; nuvem, estádio, água e calor também mudam o índice. Doses de exemplo. A decisão é do agrônomo.');
}
function insightsList(body, ins) { if (!ins.length) return; const ul = document.createElement('ul'); ul.className = 'insights'; ins.forEach(t => { const li = document.createElement('li'); li.innerHTML = t; ul.appendChild(li); }); body.appendChild(ul); }
function groupSeg(body, items) { if (!items.some(i => i[0] === S.group)) S.group = items[0][0];
  const grp = document.createElement('div'); grp.style.cssText = 'display:flex;flex-wrap:wrap;align-items:center;gap:8px'; grp.innerHTML = '<span class="note">Agrupar por</span>';
  const sg = document.createElement('div'); sg.className = 'seg'; sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', 'Agrupar por');
  items.forEach(([k, t]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-pressed', String(S.group === k)); b.addEventListener('click', () => { S.group = k; renderPanel(); }); sg.appendChild(b); });
  grp.appendChild(sg); body.appendChild(grp); }
function rankTable(body, rows, cols, rowHtml, emptyTxt) {
  if (!rows.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = emptyTxt; body.appendChild(e); return; }
  const k = cols.some(c => c[0] === S.sort.k) ? S.sort.k : 'red', dir = S.sort.dir;

  wrap.innerHTML = '<table class="tbl"><thead><tr>' + cols.map(([ck, ct, cl]) => '<th class="' + cl + '" aria-sort="' + (k === ck ? (dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-k="' + ck + '">' + ct + (k === ck ? (dir > 0 ? ' ▲' : ' ▼') : ' ⇅') + '</button></th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + rowHtml(r) + '</tr>').join('') + '</tbody></table>';
  body.appendChild(wrap);
  wrap.querySelectorAll('th button').forEach(b => b.addEventListener('click', () => { const ck = b.dataset.k; S.sort = { k: ck, dir: S.sort.k === ck ? -S.sort.dir : (ck === 'k' ? 1 : -1) }; renderPanel(); }));
}
function foot(body, t) { const n = document.createElement('div'); n.className = 'note'; n.textContent = t; body.appendChild(n); }
