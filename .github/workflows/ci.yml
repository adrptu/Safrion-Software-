name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentacao:
    name: Integridade da documentação
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Conferir PRD, instruções e decisões
        run: python3 tools/docs/checar_docs.py
      - name: Regras de segurança da própria CI (FERR-01)
        run: python3 tools/ci/checar_ci_seguranca.py
      - name: Regressão dos portões da CI (R001-01, FERR-01)
        run: python3 -m unittest discover -s tools/ci -v

  segredos:
    name: Varredura de segredos (Gitleaks, histórico inteiro)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # CLI fixada e conferida pelo checksum oficial da release (gitleaks_8.30.1_checksums.txt).
      # A gitleaks-action montava "<raiz>^..HEAD" no primeiro push e não aceita outro intervalo; no pull_request
      # pedia GET /pulls/N/commits e recebia 403 sem pull-requests: read. A CLI não usa a API nem token.
      - name: Instalar Gitleaks conferindo o checksum
        env:
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
          GITLEAKS_VERSAO: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          gitleaks_numero="${GITLEAKS_VERSAO#v}"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSAO}/gitleaks_${gitleaks_numero}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Varrer o histórico inteiro, com canário no commit raiz e cobertura conferida
        run: python3 tools/ci/varrer_segredos.py --gitleaks "$RUNNER_TEMP/gitleaks" .

  vulnerabilidades:
    name: Vulnerabilidades e configuração (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Gate do PRD 25.2: nenhuma alta/crítica aplicável sem resolução. Bloqueia com ou sem correção disponível (FERR-01).
      # Exceção só por não aplicabilidade comprovada, em .trivyignore.yaml com motivo e validade (SECURITY.md).
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # 0.74 lê o documento do projeto nos lockfiles pnpm 11+ (FERR-05).
          version: v0.74.0
          scan-type: fs
          format: json
          output: ${{ runner.temp }}/trivy-report.json
          list-all-pkgs: true
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
      - name: Conferir cobertura das dependências de produção (FERR-05)
        if: ${{ !cancelled() }}
        run: python3 tools/ci/conferir_cobertura_trivy.py "$RUNNER_TEMP/trivy-report.json" .

  codigo:
    name: Código (lockfile, lint, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Portão do contrato de código (R001-01)
        id: contrato
        # N/A só sem package.json e sem pnpm-lock.yaml; só um deles ou contrato incompleto = falha.
        run: python3 tools/ci/checar_contrato_codigo.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.contrato.outputs.ativo == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.contrato.outputs.ativo == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalação reproduzível (ENG-006)
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm install --frozen-lockfile
      - name: Versões fixadas de Node e pnpm (ENG-006)
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run doctor
      - name: Formatação (ENG-010)
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run format:check
      - name: Lint (ENG-008/009)
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run lint
      - name: Tipos (ENG-007)
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run typecheck
      - name: Testes
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run test
      - name: Integração com PostgreSQL real (ENG-025, ENG-034)
        if: steps.contrato.outputs.ativo == 'true'
        # Testcontainers sobe PostgreSQL 17 + PostGIS 3.5 fixado por digest; papéis, RLS, idempotência e isolamento.
        run: pnpm run test:integration
      - name: Build
        if: steps.contrato.outputs.ativo == 'true'
        run: pnpm run build
