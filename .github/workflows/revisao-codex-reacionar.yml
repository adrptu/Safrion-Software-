name: Revisão do Codex (reacionar)

# Quando o app do Codex cria ou atualiza o resumo da revisão num PR, ou quando o revisor publica o parecer favorável,
# roda de novo o check "Revisão do Codex no commit atual" do head desse PR. Comentário não dispara workflow no commit do PR, por isso o re-run.
# O texto do comentário só é lido pelo if do job; ele nunca entra no shell.
on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  reacionar:
    name: Reacionar o portão do Codex
    if: >-
      github.event.issue.pull_request && (github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      || contains(github.event.comment.body, 'Parecer favorável do revisor:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rodar de novo o portão no head do PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)"
          # Espera a execução do push aparecer e terminar (normalmente segundos); depois, re-run completo.
          id='' estado='' conclusao=''
          for _ in $(seq 1 20); do
            read -r id estado conclusao < <(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/revisao-codex.yml/runs?head_sha=$head&event=pull_request&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"') || true
            # Execução ainda ausente na API conta como pendente (achado do Codex 4253469813).
            [ -n "$id" ] && [ "$estado" = completed ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "Nenhuma execução do portão em $head depois da espera." >&2; exit 1; }
          [ "$estado" = completed ] || { echo "Portão ainda rodando em $head; nada a fazer."; exit 0; }
          # Reexecuta mesmo verde: resumo novo pode trazer achado que invalida o parecer (achado do Codex 4253491149).
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun"
          echo "Portão do Codex reexecutado em $head (run $id, antes: $conclusao)."
