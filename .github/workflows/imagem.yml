name: Imagens de homologação

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  imagem:
    name: Construção, execução e segurança das imagens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Construir os dois alvos, compartilhando as camadas de compilação
        id: construcao
        run: |
          mkdir -p "$RUNNER_TEMP/imagem"
          # Versão do pacote da web e commit do checkout entram na imagem (E08); o smoke confere os dois. O commit é o do
          # código construído (git rev-parse HEAD): em PR, o de composição que o checkout usou, igual ao GITHUB_SHA.
          versao="$(python3 -c "import json; print(json.load(open('apps/web/package.json'))['version'])")"
          commit="$(git rev-parse HEAD)"
          docker build --platform linux/amd64 --target web --build-arg SAFRION_VERSAO="$versao" \
            --build-arg SAFRION_COMMIT="$commit" --tag safrion-web:ci --iidfile "$RUNNER_TEMP/imagem/web.id" .
          docker build --platform linux/amd64 --target preparo --build-arg SAFRION_VERSAO="$versao" \
            --build-arg SAFRION_COMMIT="$commit" --tag safrion-preparo:ci --iidfile "$RUNNER_TEMP/imagem/preparo.id" .
      - name: Executar os containers sem rede, como não-root e somente leitura
        id: smoke
        run: python3 tools/ci/verificar_imagem.py "$RUNNER_TEMP/imagem/execucao.json"
      - name: Varrer a imagem web
        if: ${{ !cancelled() && steps.construcao.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: safrion-web:ci
          scanners: vuln,secret
          format: json
          # Relatório bruto fora da pasta publicada; pode conter conteúdo de segredo detectado.
          output: ${{ runner.temp }}/web-trivy.json
          list-all-pkgs: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Varrer a imagem de preparo
        if: ${{ !cancelled() && steps.construcao.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: safrion-preparo:ci
          scanners: vuln,secret
          format: json
          output: ${{ runner.temp }}/preparo-trivy.json
          list-all-pkgs: true
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Gerar inventários SBOM das imagens locais
        if: ${{ !cancelled() && steps.smoke.outcome != 'skipped' }}
        run: |
          trivy image --format cyclonedx --output "$RUNNER_TEMP/imagem/web-sbom.json" safrion-web:ci
          trivy image --format cyclonedx --output "$RUNNER_TEMP/imagem/preparo-sbom.json" safrion-preparo:ci
      - name: Resumir achados sem revelar valores de segredos
        if: ${{ !cancelled() && steps.construcao.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for alvo in ('web', 'preparo'):
              p = Path(os.environ['RUNNER_TEMP']) / (alvo + '-trivy.json')
              d = json.loads(p.read_text())
              achados = []
              for r in d.get('Results', []):
                  for v in r.get('Vulnerabilities', []) or []:
                      achados.append({k: v.get(k) for k in ('VulnerabilityID', 'PkgName', 'InstalledVersion', 'FixedVersion', 'Severity')})
                  for s in r.get('Secrets', []) or []:
                      achados.append({'tipo': 'segredo', 'regra': s.get('RuleID'), 'gravidade': s.get('Severity')})
              print(json.dumps({'imagem': alvo, 'achados': achados}))
              # SBOM preserva o inventário; este recibo guarda só identificação dos achados.
              # Não publica Match, Code, ambiente da imagem ou outro trecho possivelmente sensível.
              destino = p.parent / 'imagem' / (alvo + '-achados.json')
              destino.write_text(json.dumps({'imagem': alvo, 'achados': achados}) + '\n')
          PY
      - name: Preservar evidência da candidata (sem publicar as imagens)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imagem-${{ github.sha }}
          path: ${{ runner.temp }}/imagem/
          if-no-files-found: error
          retention-days: 7
