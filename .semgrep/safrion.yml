rules:
  - id: safrion-tls-verification-disabled
    languages: [typescript, javascript]
    severity: ERROR
    message: Preserve a verificação TLS; use a autoridade certificadora correta.
    pattern-either:
      - pattern: "{rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - id: safrion-request-in-sql
    languages: [typescript, javascript]
    severity: ERROR
    message: Não use entrada da requisição como texto SQL; passe valores parametrizados.
    mode: taint
    pattern-sources:
      - pattern: $REQ.json(...)
      - pattern: $REQ.text(...)
      - pattern: $REQ.query
      - pattern: $REQ.params
      - pattern: $URL.searchParams.get(...)
    pattern-sinks:
      - patterns:
          - pattern: $DB.query($SQL, ...)
          - pattern-not: "$DB.query({...}, ...)"
          - focus-metavariable: $SQL
      - patterns:
          - pattern: "$DB.query({text: $SQL, ...}, ...)"
          - focus-metavariable: $SQL
